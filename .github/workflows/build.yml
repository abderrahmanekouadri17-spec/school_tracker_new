name: Build Clean Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا المستقرة
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 التعديل الهندسي: تنظيف إعدادات التوقيع ومنع تداخل الـ NDK بأمان
      - name: تهيئة وتأمين ملفات الأندرويد
        run: |
          mkdir -p android
          echo "android.dir=" > android/local.properties

      # 👇 بناء ملف الـ APK باستخدام جلب وتحديث التوافق التلقائي للـ SDK
      - name: بناء ملف الـ APK
        run: flutter build apk --debug --build-name=1.0.0 --build-number=1

      # 👇 التقاط ملف الـ APK أينما تم توليده بنظام النجوم الشامل
      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/**/*.apk
