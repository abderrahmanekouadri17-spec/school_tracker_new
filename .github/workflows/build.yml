name: Build Clean Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا المستقرة
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 تم تحويل البناء لـ debug لتخطي تعارض مكاتب الـ release
      - name: بناء ملف الـ APK
        run: flutter build apk --debug

      # 👇 تعديل مسار التقاط الملف ليتوافق مع نسخة الـ debug الشاملة
      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/**/*.apk
