name: Build Clean Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا المستقرة
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 الضربة القاضية: إجبار جميع المكتبات الفرعية (مثل file_picker) على استخدام SDK 36
      - name: إجبار المكتبات الفرعية على التوافق مع SDK 36
        run: |
          cat <<EOF >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      # بناء ملف الـ APK بصيغة Debug الآمنة
      - name: بناء ملف الـ APK
        run: flutter build apk --debug

      # توفير الـ APK للتحميل بنظام النجمتين الشامل
      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/**/*.apk
