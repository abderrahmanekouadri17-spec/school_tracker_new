name: Build Clean Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا المستقرة
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 الضربة القاضية: ضبط وتحديث إعدادات أندرويد الداخلية لتتوافق مع شروط كودك والمكتبات
      - name: تهيئة وتحديث إعدادات Android SDK الصارمة
        run: |
          if [ -f android/app/build.gradle ]; then
            # 1. رفع الحد الأدنى للـ SDK إلى 23 (مطلوب إجبارياً لمكتبة البصمة local_auth والمكتبات الأخرى)
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 23/g' android/app/build.gradle
            
            # 2. رفع إصدار التجميع والـ target إلى 34 لضمان التوافق الكامل
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/app/build.gradle
          fi

      - name: بناء ملف الـ APK
        run: flutter build apk --debug

      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/**/*.apk
